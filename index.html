<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">

    <title>Blog Preview Card</title>
</head>
<body>
  <article class="card-container">
    <img class="card-image" src="images/illustration-article.svg" alt="Ilustração do artigo">
    
    <span class="tag">Learning</span>
    
    <p class="published-date">Published 21 Dec 2023</p>
    
    <h2 class="card-title"><a href="#">HTML & CSS foundations</a></h2>
    
    <p class="card-text">These languages are the backbone of every website, defining structure, content, and presentation.</p>
  
    <footer class="footer">
        <img class="footer-image" src="images/image-avatar.webp" alt="Foto do autor">
        <span>Greg Hooper</span>
    </footer>
  </article>
</body>
</html>
